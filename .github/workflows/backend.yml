name: Backend correctness

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: github_bounty_dispenser_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d github_bounty_dispenser_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/github_bounty_dispenser_test
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/github_bounty_dispenser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline migration render
        run: alembic upgrade head --sql > /tmp/migration.sql
      - name: Upgrade and downgrade chain
        run: |
          alembic upgrade head
          alembic downgrade 20260725_0007
          alembic upgrade head
      - name: PostgreSQL integration and concurrency tests
        run: pytest -m "integration or concurrency" -q
      - name: Unit tests
        run: pytest -m unit -q
